---
# Fetch or create secrets in Cloudflare KV and set facts for template

- name: Ensure Cloudflare KV namespace exists (get id)
  uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ cloudflare_account_id }}/storage/kv/namespaces"
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: application/json
  register: kv_list
  changed_when: false

- name: Select or create namespace
  set_fact:
    kv_namespace_id: "{{ (kv_list.json.result | selectattr('title', 'equalto', cloudflare_kv_namespace_title) | list | first).id if (kv_list.json.result | selectattr('title', 'equalto', cloudflare_kv_namespace_title) | list) else '' }}"

- name: Create namespace if missing
  when: kv_namespace_id == ''
  uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ cloudflare_account_id }}/storage/kv/namespaces"
    method: POST
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: application/json
    body_format: json
    body:
      title: "{{ cloudflare_kv_namespace_title }}"
  register: kv_create

- name: Set namespace id (created)
  when: kv_namespace_id == ''
  set_fact:
    kv_namespace_id: "{{ kv_create.json.result.id }}"

- name: Define desired secrets
  set_fact:
    desired_secrets:
      - { key: "{{ cloudflare_kv_env_prefix }}:GOTRUE_JWT_SECRET", gen: true }
      - { key: "{{ cloudflare_kv_env_prefix }}:NEO4J_PASSWORD", gen: true }
      - { key: "{{ cloudflare_kv_env_prefix }}:NEBULA_PASSWORD", gen: true }
      - { key: "{{ cloudflare_kv_env_prefix }}:TERMINUSDB_TOKEN", gen: true }
      - { key: "{{ cloudflare_kv_env_prefix }}:CLOUDFLARE_TUNNEL_TOKEN", gen: false }
      - { key: "{{ cloudflare_kv_env_prefix }}:DATABASE_URL", gen: false, default: "{{ database_url }}" }
      - { key: "{{ cloudflare_kv_env_prefix }}:LOCALAI_BASE_URL", gen: false, default: "{{ localai_base_url }}" }
      - { key: "{{ cloudflare_kv_env_prefix }}:API_BASE_URL", gen: false, default: "{{ api_base_url }}" }
      - { key: "{{ cloudflare_kv_env_prefix }}:WEB_BASE_URL", gen: false, default: "{{ web_base_url }}" }

- name: Ensure each secret exists in KV
  vars:
    secret_key: "{{ item.key }}"
  block:
    - name: Try get secret value
      uri:
        url: "https://api.cloudflare.com/client/v4/accounts/{{ cloudflare_account_id }}/storage/kv/namespaces/{{ kv_namespace_id }}/values/{{ secret_key | urlencode }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
      register: secret_value
      failed_when: false
      changed_when: false

    - name: Generate and put secret if missing and gen=true
      when: secret_value.status != 200 and item.gen | bool
      vars:
        new_secret: "{{ lookup('community.general.random_string', length=48, special=false) }}"
      uri:
        url: "https://api.cloudflare.com/client/v4/accounts/{{ cloudflare_account_id }}/storage/kv/namespaces/{{ kv_namespace_id }}/values/{{ secret_key | urlencode }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: text/plain
        body: "{{ new_secret }}"

    - name: Put default value if missing and default provided
      when: secret_value.status != 200 and (item.default is defined)
      uri:
        url: "https://api.cloudflare.com/client/v4/accounts/{{ cloudflare_account_id }}/storage/kv/namespaces/{{ kv_namespace_id }}/values/{{ secret_key | urlencode }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: text/plain
        body: "{{ item.default }}"

    - name: Set fact for each secret (read again)
      uri:
        url: "https://api.cloudflare.com/client/v4/accounts/{{ cloudflare_account_id }}/storage/kv/namespaces/{{ kv_namespace_id }}/values/{{ secret_key | urlencode }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
      register: secret_value2
      changed_when: false

    - name: Accumulate env secrets
      set_fact:
        env_secrets: "{{ (env_secrets | default({})) | combine({ (secret_key.split(':')[-1]): secret_value2.content }) }}"
  loop: "{{ desired_secrets }}"

- name: Populate Ansible vars from KV secrets
  set_fact:
    gotrue_jwt_secret: "{{ env_secrets['GOTRUE_JWT_SECRET'] | default(gotrue_jwt_secret) }}"
    neo4j_password: "{{ env_secrets['NEO4J_PASSWORD'] | default(neo4j_password) }}"
    nebula_password: "{{ env_secrets['NEBULA_PASSWORD'] | default(nebula_password) }}"
    terminusdb_token: "{{ env_secrets['TERMINUSDB_TOKEN'] | default(terminusdb_token) }}"
    cloudflare_tunnel_token: "{{ env_secrets['CLOUDFLARE_TUNNEL_TOKEN'] | default(cloudflare_tunnel_token) }}"
    database_url: "{{ env_secrets['DATABASE_URL'] | default(database_url) }}"
    localai_base_url: "{{ env_secrets['LOCALAI_BASE_URL'] | default(localai_base_url) }}"
    api_base_url: "{{ env_secrets['API_BASE_URL'] | default(api_base_url) }}"
    web_base_url: "{{ env_secrets['WEB_BASE_URL'] | default(web_base_url) }}"
