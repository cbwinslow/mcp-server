environment:
  required_vars:
    - DATABASE_URL
    - NEO4J_URI
    - NEO4J_USER
    - NEO4J_PASSWORD

crewai_config:
  process: hierarchical
  memory: true
  verbose: true

agents:
  - name: ingest-agent
    role: Repository Ingestion
    goal: Ingest repos, extract files, and index into Postgres/pgvector and Neo4j.
    backstory: Experienced data engineer specializing in code ingestion.
    tools: ["mcp_database_query", "mcp_embeddings_generator"]
    llm: gpt-4o-mini
    allow_delegation: true
    verbose: true

  - name: crawl-agent
    role: Web Crawler
    goal: Crawl documentation and knowledge sources using Crawl4AI MCP.
    backstory: Web crawling specialist with robust extraction skills.
    tools: ["mcp_crawl4ai"]
    llm: gpt-4o-mini
    allow_delegation: true
    verbose: true

  - name: graph-agent
    role: Graph Builder
    goal: Maintain entities/relations in Neo4j and coordinate with Graphiti.
    backstory: Knowledge graph engineer focused on temporal graphs.
    tools: ["mcp_server_status", "github_repo_search"]
    llm: gpt-4o-mini
    allow_delegation: true
    verbose: true

  - name: search-agent
    role: Hybrid Search
    goal: Execute vector and graph-augmented search for user queries.
    backstory: Retrieval expert combining pgvector and graph traversals.
    tools: ["mcp_database_query"]
    llm: gpt-4o-mini
    allow_delegation: true
    verbose: true

tasks:
  - name: seed-index
    agent: ingest-agent
    description: Index seed documents into pgvector and sync entities to Neo4j.
    expected_output: Summary of indexed docs and entity counts.
    context: []
    async_execution: false

  - name: crawl-docs
    agent: crawl-agent
    description: Crawl target documentation domains and store text for indexing.
    expected_output: List of crawled URLs and content stats.
    context: []
    async_execution: true

  - name: build-graph
    agent: graph-agent
    description: Construct and refine the knowledge graph, validate relations.
    expected_output: Node and edge counts, anomalies.
    context: []
    async_execution: false

  - name: hybrid-query
    agent: search-agent
    description: Run hybrid search queries for test inputs.
    expected_output: Top results with reasoning of selection.
    context: []
    async_execution: false

