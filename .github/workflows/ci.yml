name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install ruff mypy
      - name: Run unit tests
        env:
          API_BASE_URL: http://localhost:8000
        run: |
          ruff check .
          mypy src || true
          pytest -q

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json
      - name: Install deps
        working-directory: webapp
        run: |
          npm ci
          npx playwright install --with-deps
      - name: Run Playwright smoke
        working-directory: webapp
        run: npx playwright test
        continue-on-error: true

  tfvars-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Render tfvars
        run: ansible-playbook -i ansible/inventory.ini ansible/tfvars.yml
      - name: Upload tfvars artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-tfvars
          path: infra/terraform/cloudflare/terraform.tfvars

  validation-dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps (api only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run validator script (dry)
        run: |
          python scripts/server/run_validation.py > validation-report.json || true
      - name: Extract score
        id: score
        run: |
          python - <<'PY'
import json,sys
try:
  data=json.load(open('validation-report.json'))
  print(f"score={int(data.get('score') or 0)}")
except Exception:
  print("score=0")
PY
      - name: Set job summary and warn
        env:
          MIN: ${{ vars.VALIDATION_MIN_SCORE || '70' }}
        run: |
          echo "## Validation Score: ${{ steps.score.outputs.score }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.score.outputs.score }}" -lt "$MIN" ]; then
            echo "::warning::Validation score ${{ steps.score.outputs.score }} below threshold $MIN"
          fi
      - name: Upload validation report artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation-report.json
        continue-on-error: true
