[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server"
version = "1.0.0"
description = "MCP Server for GitHub repository ingestion and harvesting with CrewAI agent integration"
authors = [
    {name = "MCP Team", email = "team@mcp-server.local"}
]
dependencies = [
    # Core MCP server dependencies
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.12.0",

    # GitHub integration
    "pygithub>=2.0.0",
    "gitpython>=3.1.40",

    # Data processing
    "pandas>=2.1.0",
    "numpy>=1.24.0",

    # Embeddings and ML
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",

    # CrewAI agent framework
    "crewai>=0.1.0",
    "crewai-tools>=0.1.0",

    # HTTP client for MCP communication
    "httpx>=0.25.0",
    "requests>=2.31.0",

    # Bitwarden Secrets Manager integration
    "bitwarden-sdk>=0.1.0",
    "python-dotenv>=1.0.0",

    # Configuration and serialization
    "pyyaml>=6.0",

    # Logging
    "structlog>=23.1.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20.0",
    "sentry-sdk>=2.8.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-requests>=0.46b0",

    # Optional OpenAI integration
    "openai>=1.0.0",
    "pymongo>=4.6.0",
    # Postgres (async)
    "asyncpg>=0.29.0",
    # Auth
    "PyJWT>=2.8.0",
    # Neo4j driver
    "neo4j>=5.16.0",
    # Optional graph backends
    "terminusdb-client>=10.0.0",
    "nebula3-python>=3.8.0",
    # Agents
    "pydantic-ai>=0.0.8",
    # LlamaIndex & friends
    "llama-index>=0.11.0",
    "llama-index-vector-stores-postgres>=0.2.0",
    "llama-index-graph-stores-neo4j>=0.2.0",
    "llama-parse>=0.4.0",
    "llama-hub>=0.0.79",
    # Graphiti core for temporal KG (HTTP shim)
    "graphiti-core>=0.1.0",
    # Repo ingestion
    "gitpython>=3.1.40",
    # SSE client (for future Graphiti MCP direct integration)
    "aiohttp>=3.9.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
]

[project.scripts]
mcp-server = "mcp_ingest.main:main"
crewai-agent = "crewai_agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_ingest*", "crewai*"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "crewai.*",
    "crewai_tools.*",
]
ignore_missing_imports = true
