[tool:pytest]
addopts = --cov=mcp_ingest --cov-report=html --cov-report=term-missing --cov-branch --asyncio-mode=auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: marks tests as unit tests (no external deps)
    integration: marks tests as integration tests (DB, external services)
    e2e: marks tests as end-to-end tests (full app flow)