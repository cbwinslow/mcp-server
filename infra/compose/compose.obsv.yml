version: "3.9"

name: mcp-obsv

networks:
  net_back:
    external: true

volumes:
  loki_data: {}
  grafana_data: {}

services:
  loki:
    image: grafana/loki:2.9.6
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ../obsv/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - net_back
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:2.9.6
    container_name: promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ../obsv/promtail/config.yaml:/etc/promtail/config.yaml:ro
    networks:
      - net_back

  grafana:
    image: grafana/grafana:10.4.3
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ../obsv/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - net_back
    ports:
      - "127.0.0.1:3000:3000"

