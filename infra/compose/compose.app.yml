version: "3.9"

name: mcp-app

networks:
  net_back:
    external: true
  net_db:
    external: true

services:
  mcp-api:
    image: ghcr.io/your-org/mcp-api:latest # replace in CI
    container_name: mcp-api
    restart: unless-stopped
    environment:
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 8000
      # Async SQLAlchemy URL with asyncpg
      DATABASE_URL: ${DATABASE_URL}
      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # CORS / Auth
      ALLOW_ORIGINS: "*"
    command: ["uvicorn", "src.mcp_ingest.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"  # Access via Kong route in prod
    networks:
      - net_back
      - net_db
    depends_on:
      - neo4j
    # Note: mcp-api expects DB to be available; ensure db stack is up.

  mcp-worker:
    image: ghcr.io/your-org/mcp-worker:latest # replace in CI
    container_name: mcp-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      WORKER_TYPE: "ingest"  # or embeddings
    networks:
      - net_back
      - net_db

  # Optional: llamaindex service (API facade for hybrid retrieval)
  llama-hybrid:
    image: ghcr.io/your-org/llama-hybrid:latest
    container_name: llama-hybrid
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    ports:
      - "127.0.0.1:8010:8000"
    networks:
      - net_back
      - net_db

depends_on:
  neo4j:
    condition: service_started

